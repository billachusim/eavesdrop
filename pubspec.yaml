name: eavesdrop
description: "Live Conversations Worth Listening To"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.5.0+6

environment:
  sdk: '>=3.10.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.9
  google_fonts: ^8.2.0
  avatar_glow: ^3.0.1
  firebase_core: ^4.12.1
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5
  firebase_auth: ^6.5.6
  firebase_crashlytics: ^5.2.6
  firebase_analytics: ^12.4.5
  firebase_messaging: ^16.4.3
  firebase_core_platform_interface: ^8.0.0
  provider: ^6.1.5+1
  agora_rtc_engine: ^6.5.3
  audioplayers: ^6.5.1
  path_provider: ^2.1.5
  flutter_lints: ^2.0.3
  permission_handler: ^12.0.1
  firebase_app_check: ^0.4.5+2
  cloud_functions: ^6.3.5
  in_app_purchase: ^3.3.0
  in_app_purchase_storekit: ^0.4.11
  get: ^4.7.3
  url_launcher: ^6.3.2
  add_2_calendar: 3.0.1
  booking_calendar: ^1.1.10
  shared_preferences: ^2.5.4
  uuid: 4.5.2
  rxdart: ^0.28.0
  vibration: ^3.1.8
  cached_network_image: ^3.4.1
  http: ^1.2.2
  intl: ^0.18.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4


flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/eaves.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/eaves.png"


flutter_native_splash:
  color: "#000000"
  image: "assets/images/iconWhitePetal.png"
  ios: true
  android: true


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
